wning outcomes, not excuses",phrase:"Leaders take ownership for results.",note:"Paraphrase. Ownership supports team results, not personal credit."},{id:"abrashoff-ship",source:"D. Michael Abrashoff - It's Your Ship",focus:"Decisions and improvement closest to the work",phrase:"Push control to the people closest to the work.",note:"Paraphrase. Empowerment is required for adaptation."},{id:"maxwell-yourself",source:"John Maxwell (leadership themes)",focus:"Personal growth as a professional duty",phrase:"Work harder on yourself than on your job.",note:"Used here as a norm for learning and maturity."},{id:"sinek-why",source:"Simon Sinek (themes)",focus:"Purpose clarifies decision-making",phrase:"Start with why.",note:"Short-form credit for purpose-first thinking."}]},{id:"agile",title:"Agile & Product Learning",items:[{id:"agile-manifesto",source:"Agile Manifesto (Values & Principles)",focus:"Feedback, adaptation, customer value",phrase:"Deliver frequently; welcome change; reflect and adjust.",note:"Paraphrase of multiple principles. The point is short learning loops."},{id:"scrum-values",source:"Scrum Guide - Scrum Values",focus:"Commitment, Focus, Openness, Respect, Courage",note:"Culture is how values show up in day-to-day behavior."},{id:"sooner-safer-happier",source:"Jonathan Smart et al. - Sooner Safer Happier",focus:"Small steps; safety enabling speed",phrase:"Safety enables speed.",note:"Paraphrase. We optimize for fast learning with guardrails."},{id:"sutherland-scrum",source:"Jeff Sutherland (Scrum themes)",focus:"Empirical process control",note:"Credit for cadence, transparency, and inspection/adaptation."}]},{id:"itil",title:"IT Service Management (ITIL 4)",items:[{id:"itil-focus",source:"ITIL 4 - Guiding Principles",focus:"Value-first decisions",phrase:"Focus on value."},{id:"itil-iterate",source:"ITIL 4 - Guiding Principles",focus:"Iterative progress",phrase:"Progress iteratively with feedback."},{id:"itil-holistic",source:"ITIL 4 - Guiding Principles",focus:"End-to-end thinking",phrase:"Think and work holistically."},{id:"itil-visibility",source:"ITIL 4 - Guiding Principles",focus:"Visibility",phrase:"Collaborate and promote visibility."},{id:"itil-practices",source:"ITIL 4 - Practices",focus:"Incident, Problem, Change Enablement, Knowledge, Continual Improvement",note:"Practices are tools, not bureaucracy."}]},{id:"flow",title:"Flow, Systems, and Delivery",items:[{id:"accelerate",source:"Forsgren, Humble, Kim - Accelerate",focus:"Flow + feedback improve outcomes",note:"Paraphrase. Optimize the system, not local activity."},{id:"phoenix",source:"Kim, Behr, Spafford - The Phoenix Project",focus:"WIP limits, constraints, flow",note:"Paraphrase. Flow beats local optimization."},{id:"goldratt",source:"Eliyahu Goldratt - Theory of Constraints",focus:"Bottlenecks govern throughput"},{id:"littles-law",source:"Queueing theory - Little's Law",focus:"WIP = Throughput x Lead Time"},{id:"newport-deep",source:"Cal Newport - Deep Work",focus:"Focus creates outsized output"}]}],J={toc:{id:"toc",name:"Theory of Constraints (TOC)",oneLiner:"Throughput is limited by the bottleneck.",whyItMatters:"Improving non-constraints does not improve end-to-end delivery.",practicalMove:"Find the constraint -> exploit -> subordinate -> elevate -> repeat.",commonPitfall:"Local optimization that ignores the bottleneck.",sourceCredit:"Goldratt / knowledge-work laws"},littles:{id:"littles",name:"Little's Law",oneLiner:"WIP = Throughput x Lead Time.",whyItMatters:"More WIP almost always means longer lead time.",practicalMove:"Cap WIP; finish work before starting new work.",commonPitfall:"Starting more work to look busy.",sourceCredit:"Queueing theory / knowledge-work laws"},context_switching:{id:"context_switching",name:"Context Switching",oneLiner:"Concurrency destroys focus and stretches lead times.",whyItMatters:"Multitasking taxes working memory; quality drops.",practicalMove:"WIP limits; focus blocks; reduce part-time assignments.",commonPitfall:
